name: Deploy Website

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    name:
      Deploy to ${{ github.ref_name == 'main' && 'Production' || 'Staging' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Cache Next.js build
        uses: actions/cache@v3
        with:
          path: |
            .next/cache
            node_modules/.cache
          key:
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{
            hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment
        run: |
          echo "NODE_ENV=production" > .env.production
          echo "API_URL=https://api.skyheightsacademy.ng/api" >> .env.production

      - name: Build application
        run: |
          export NODE_OPTIONS=--max-old-space-size=4096
          pnpm run build --NODE_ENV=${{ github.ref_name == 'main' && 'production' || 'staging' }}

      - name: Deploy to server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username:
            ${{ github.ref_name == 'main' && secrets.FTP_USERNAME ||
            secrets.FTP_STAGING_USERNAME }}
          password:
            ${{ github.ref_name == 'main' && secrets.FTP_PASSWORD ||
            secrets.FTP_STAGING_PASSWORD }}
          protocol: ftps
          local-dir: ./
          log-level: verbose
          exclude: |
            **/.git/**
            **/.gitignore
            **/node_modules/**
            **/.github/**
            **/.vscode/**
            **/README.md
            **/.env*
            **/package-lock.json
            **/yarn.lock
            **/*.log
            **/.DS_Store
            **/Thumbs.db
            **/coverage/**
            **/.nyc_output/**
            **/.next/cache/**
            **/src/**
            **/tsconfig.json
            **/next.config.ts
            **/postcss.config.mjs
            **/tailwind.config.ts
            **/eslint.config.mjs
            **/next-env.d.ts
