name: Deploy Website

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'Production' || 'Staging' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            node_modules/.cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{
            hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment (production)
        if: github.ref_name == 'main'
        run: mv .env.production .env

      - name: Setup environment (staging)
        if: github.ref_name == 'staging'
        run: |
          rm -f .env.production .env.production.local .env.local
          mv .env.staging .env

      - name: Build Next.js application
        run: pnpm run build:deploy
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Create deployment package
        run: |
          # Pack contents of .next/standalone so extract lands in docroot (no standalone/ subfolder)
          tar -czf standalone-deploy.tar.gz -C .next/standalone .
          ls -lh standalone-deploy.tar.gz

      - name: Upload deployment package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.   }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT }}
          source: "standalone-deploy.tar.gz"
          target: "/tmp/"
          overwrite: true
          timeout: 2m
          command_timeout: 20m

      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            if [ "${{ github.ref_name }}" = "staging" ]; then
              DEPLOY="/home/amrohvgf/staging.skyheightsacademy.ng"
            else
              DEPLOY="/home/amrohvgf/skyheightsacademy.ng"
            fi
            cd "$DEPLOY"

            tar -xzf /tmp/standalone-deploy.tar.gz
            rm -f /tmp/standalone-deploy.tar.gz

            chmod -R 755 .next node_modules public 2>/dev/null || true
            chmod 755 server.js 2>/dev/null || chmod 755 server.mjs 2>/dev/null || true

            [ -f ".env.production" ] && cp ".env.production" .env || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skyheights-build-${{ github.ref_name }}
          path: |
            .next/standalone/
          retention-days: 7
